# Save as .github/workflows/ath10kmac-release.yml in the kext repository.
# The Makefile, src/, scripts/, firmware/, and Ath10kMac.kext/ must be at its root.
# Push v0.0.91 to release the current source; future tags must match its version.
# Branch pushes, pull requests, and manual branch runs produce build artifacts.

name: Ath10kMac Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build x86_64 kext
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify toolchain and MacKernelSDK
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          xcrun --show-sdk-path
          python3 --version

          # Also support source uploads that omit the SDK submodule.
          if [[ ! -d MacKernelSDK ]]; then
            git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
          fi
          test -f MacKernelSDK/Headers/Availability.h
          test -f MacKernelSDK/Library/x86_64/libkmod.a
          test -f MacKernelSDK/Library/universal/libkmodc++.a

      - name: Validate version and release tag
        id: metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          import re
          from pathlib import Path

          info = plistlib.loads(Path("Ath10kMac.kext/Contents/Info.plist").read_bytes())
          version = info["CFBundleVersion"]
          if not isinstance(version, str) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("CFBundleVersion must use the major.minor.patch format.")
          if info.get("CFBundleShortVersionString") != version:
              raise SystemExit("The two Info.plist version fields must match.")
          source = Path("src/kext/kmod_info.c").read_text()
          module = re.search(r'KMOD_EXPLICIT_DECL\([^,]+,\s*"([^"]+)"', source)
          if not module or module.group(1) != version:
              raise SystemExit("The kmod_info.c version must match Info.plist.")

          is_tag = os.environ["GITHUB_REF"].startswith("refs/tags/")
          if is_tag:
              tag = os.environ["GITHUB_REF_NAME"]
              pattern = r"v" + re.escape(version) + r"(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
              if not re.fullmatch(pattern, tag):
                  raise SystemExit(f"Tag {tag!r} does not match source version {version}. Use v{version}.")
              package_version = tag[1:]
              prerelease = "-" in package_version
          else:
              package_version = f'{version}-dev.{os.environ["GITHUB_SHA"][:12]}'
              prerelease = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"package_version={package_version}\n")
              output.write(f"prerelease={str(prerelease).lower()}\n")
              output.write(f"artifact_name=Ath10kMac-{package_version}-x86_64\n")
          PY

      - name: Build and check kext symbols
        run: |
          set -euo pipefail
          make clean
          make -j"$(sysctl -n hw.logicalcpu)" kext
          plutil -lint build/out/Ath10kMac.kext/Contents/Info.plist
          xcrun lipo build/out/Ath10kMac.kext/Contents/MacOS/Ath10kMac -verify_arch x86_64
          test "$(xcrun lipo build/out/Ath10kMac.kext/Contents/MacOS/Ath10kMac -archs)" = "x86_64"
          xcrun dwarfdump --uuid build/out/Ath10kMac.kext/Contents/MacOS/Ath10kMac

      - name: Package kext, notices, and checksum
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          stage="build/release"
          archive="Ath10kMac-${PACKAGE_VERSION}-x86_64.zip"
          mkdir -p "$stage/Licenses" build/dist
          ditto build/out/Ath10kMac.kext "$stage/Ath10kMac.kext"
          chmod 755 "$stage/Ath10kMac.kext/Contents/MacOS/Ath10kMac"

          if [[ -f README.md ]]; then
            cp README.md "$stage/README.md"
          fi
          for license in LICENSE LICENSE.txt LICENSE.md COPYING; do
            if [[ -f "$license" ]]; then
              cp "$license" "$stage/$license"
            fi
          done
          cp MacKernelSDK/LICENSE.txt "$stage/Licenses/MacKernelSDK.txt"
          cp firmware/LICENSE.QualcommAtheros_ath10k "$stage/Licenses/"
          cp firmware/notice_ath10k_firmware-6.txt "$stage/Licenses/QCA6174-firmware-notice.txt"
          cp firmware/QCA9377/hw1.0/notice_ath10k_firmware-6.txt "$stage/Licenses/QCA9377-firmware-notice.txt"
          cp regulatory/LICENSE "$stage/Licenses/wireless-regdb.txt"

          # Record the exact source commit without changing the driver version.
          printf 'Ath10kMac package: %s\nSource commit: %s\nArchitecture: x86_64\n' \
            "$PACKAGE_VERSION" "$GITHUB_SHA" > "$stage/BUILD-INFO.txt"
          ditto -c -k --norsrc "$stage" "build/dist/$archive"
          (cd build/dist && shasum -a 256 "$archive" > "$archive.sha256")
          unzip -t "build/dist/$archive"

          {
            printf '### Ath10kMac %s\n\n' "$PACKAGE_VERSION"
            printf 'Build and symbol checks completed for x86_64.\n\n'
            printf 'Package: \x60%s\x60\n\n' "$archive"
            cat "build/dist/$archive.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: build/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native-sequoia:
    name: Sequoia native stage ${{ matrix.stage }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [3, 0]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Portable native regressions
        run: python3 tests/run-development-tests.py
      - name: Build and sign native candidate
        run: |
          set -euo pipefail
          make NATIVE=1 DIAGNOSTIC_STAGE=${{ matrix.stage }} -j2 kext
          codesign --force --sign - build/native/out/Ath10kMac.kext
          codesign --verify --strict --verbose=2 build/native/out/Ath10kMac.kext
          python3 scripts/windows/validate.py build/native/out/Ath10kMac.kext
          python3 - <<'PY'
          import plistlib
          p=plistlib.load(open('build/native/out/Ath10kMac.kext/Contents/Info.plist','rb'))
          profiles=p['IOKitPersonalities']
          assert profiles['LiteOn-QCA6174']['IOPCIMatch']=='0x003E168C'
          assert profiles['LiteOn-QCA6174']['IOPCISecondaryMatch']=='0x080711ad'
          assert profiles['LiteOn-QCA6174']['Ath10kDiagnosticStage']==${{ matrix.stage }}
          PY
      - name: Package native candidate
        run: |
          set -euo pipefail
          mkdir -p build/native/dist
          ditto -c -k --norsrc build/native/out/Ath10kMac.kext build/native/dist/Ath10kMac-Sequoia-stage${{ matrix.stage }}.zip
          cp build/native/out/validation.json build/native/dist/
          shasum -a 256 build/native/dist/Ath10kMac-Sequoia-stage${{ matrix.stage }}.zip > build/native/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Ath10kMac-Sequoia-stage${{ matrix.stage }}
          path: build/native/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify package checksum
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check --strict ./*.sha256

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Ath10kMac-${PACKAGE_VERSION}-x86_64.zip" \
            "dist/Ath10kMac-${PACKAGE_VERSION}-x86_64.zip.sha256" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "Ath10kMac ${PACKAGE_VERSION}" \
            --generate-notes \
            "${options[@]}"

