name: macOS kext build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kext/**"
      - "src/common/**"
      - "scripts/build_kext_macos.sh"
      - ".github/workflows/macos-kext.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Fetch pinned MacKernelSDK
        run: |
          git clone --filter=blob:none https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
          git -C MacKernelSDK checkout 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          test -f MacKernelSDK/Library/x86_64/libkmod.a

      - name: Build unsigned kext
        run: ./scripts/build_kext_macos.sh "$RUNNER_TEMP/kext-build"

      - name: Collect artifact
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d "$RUNNER_TEMP/kext-build/QCA6174Wifi.kext" ]; then
            cp -R "$RUNNER_TEMP/kext-build/QCA6174Wifi.kext" artifacts/
            plutil -p artifacts/QCA6174Wifi.kext/Contents/Info.plist > artifacts/kext-info.txt
            file artifacts/QCA6174Wifi.kext/Contents/MacOS/QCA6174Wifi > artifacts/kext-file.txt
            shasum -a 256 artifacts/QCA6174Wifi.kext/Contents/MacOS/QCA6174Wifi > artifacts/SHA256SUMS
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QCA6174Wifi-macos-unsigned
          path: artifacts
          if-no-files-found: error
          retention-days: 14
