name: QCA6174Wifi
options:
  bundleIdPrefix: com.opensource.qca6174
  deploymentTarget:
    macOS: "11.0"
settings:
  base:
    ARCHS: x86_64
    ONLY_ACTIVE_ARCH: NO
    CLANG_CXX_LANGUAGE_STANDARD: gnu++14
    CLANG_CXX_LIBRARY: libc++
    MACOSX_DEPLOYMENT_TARGET: "11.0"
targets:
  QCA6174Wifi:
    type: kernel-extension
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: kext/QCA6174Wifi
        excludes:
          - Info.plist
      - path: src/common/qca6174_regs.c
      - path: src/common/hw_params.c
      - path: src/common/fw_load_sm.c
    info:
      path: kext/QCA6174Wifi/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opensource.qca6174.QCA6174Wifi
        PRODUCT_NAME: QCA6174Wifi
        EXECUTABLE_NAME: QCA6174Wifi
        INFOPLIST_FILE: kext/QCA6174Wifi/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SKIP_INSTALL: NO
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        GCC_C_LANGUAGE_STANDARD: c11
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/src/common"
        OTHER_CFLAGS:
          - -mkernel
          - -fno-builtin
        OTHER_CPLUSPLUSFLAGS:
          - -mkernel
          - -fapple-kext
          - -fno-builtin
          - -nostdinc++
        OTHER_LDFLAGS:
          - -lkmod
        MODULE_NAME: com.opensource.qca6174.QCA6174Wifi
schemes:
  QCA6174Wifi:
    build:
      targets:
        QCA6174Wifi: all
